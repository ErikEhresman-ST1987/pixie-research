<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15212a"><title>Pixie Research — Time of Day</title><style>*{box-sizing:border-box}body{margin:0;background:#15212a;color:#f2f5f5;font:16px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:16px}h1{font-size:clamp(1.45rem,4vw,2rem)}a{color:#a4e9df}#stage{width:100%;aspect-ratio:4/3;max-height:480px;border:1px solid #829da3;border-radius:10px;overflow:hidden;background:#8ebbc4}canvas{display:block;width:100%;height:100%}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button{font:inherit;min-height:44px;padding:10px 13px;border:0;border-radius:9px}button[aria-pressed=true]{outline:3px solid #a4e9df}#status{line-height:1.5;min-height:3em}</style></head><body><main><p><a href="../../">← All experiments</a></p><h1>Experiment 09: Time of Day and Lighting</h1><p>One unchanged landscape, three lighting treatments. Compare mood and readability, then try gentle transitions or reduced motion.</p><div id="stage" aria-label="Landscape showing daylight, sunset, or nighttime lighting"></div><div class="controls"><button data-time="day">Day</button><button data-time="sunset">Sunset</button><button data-time="night">Night</button><button id="smooth">Transitions: ON</button><button id="reduce">Reduced motion: OFF</button><button id="reset">Reset</button></div><p id="status" role="status">Loading PixiJS…</p><script src="https://cdn.jsdelivr.net/npm/pixi.js@8.21.0/dist/pixi.min.js"></script><script>
(async()=>{const host=document.getElementById('stage'),status=document.getElementById('status');if(!window.PIXI){status.textContent='PixiJS failed to load. Internet connection required.';return;}
const app=new PIXI.Application();await app.init({resizeTo:host,background:'#a8d2d7',antialias:true,resolution:Math.min(devicePixelRatio||1,2)});app.canvas.style.width='100%';app.canvas.style.height='100%';host.appendChild(app.canvas);
const world=new PIXI.Container();app.stage.addChild(world);
const sky=new PIXI.Graphics().rect(0,0,800,600).fill(0x9bcbd4).ellipse(145,330,370,165).fill(0x86b3a1).ellipse(640,345,410,185).fill(0x719d8b).rect(0,365,800,235).fill(0x80ae77).ellipse(450,575,590,140).fill(0x689a6e);world.addChild(sky);
const sun=new PIXI.Graphics().circle(670,105,49).fill(0xfff0bd);world.addChild(sun);
const pond=new PIXI.Graphics().ellipse(160,490,145,50).fill(0x528fa0).ellipse(155,480,115,25).fill({color:0xb9e0d7,alpha:.35});world.addChild(pond);
const house=new PIXI.Graphics().roundRect(330,270,240,200,8).fill(0xd4b68c).moveTo(305,283).lineTo(450,185).lineTo(595,283).closePath().fill(0x85564b).rect(362,330,62,60).fill(0x547e88).rect(479,330,62,60).fill(0x547e88).roundRect(430,378,48,92,5).fill(0x7a5745);world.addChild(house);
const trees=new PIXI.Graphics();for(const [x,y,s] of [[75,355,1],[700,370,1.2],[620,385,.8]]){trees.rect(x-9*s,y,18*s,100*s).fill(0x755844).circle(x,y,49*s).fill(0x3c795a).circle(x-23*s,y+12*s,30*s).fill(0x488463);}world.addChild(trees);
const shade=new PIXI.Graphics().rect(0,0,800,600).fill(0xffffff);shade.alpha=0;world.addChild(shade);
const glow=new PIXI.Graphics().ellipse(392,360,66,55).fill({color:0xffe4a0,alpha:.35}).ellipse(511,360,66,55).fill({color:0xffe4a0,alpha:.35}).roundRect(365,332,56,56,5).fill(0xffd782).roundRect(482,332,56,56,5).fill(0xffd782);glow.alpha=0;world.addChild(glow);
const stars=new PIXI.Graphics();for(let i=0;i<22;i++){const x=24+(i*137)%746,y=25+(i*47)%205;stars.circle(x,y,i%4===0?2.4:1.4).fill(0xf7f4e0);}stars.alpha=0;world.addChild(stars);
const shadows=new PIXI.Graphics().ellipse(480,470,195,30).fill({color:0x3b4560,alpha:.32}).ellipse(100,450,85,15).fill({color:0x3b4560,alpha:.22});shadows.alpha=0;world.addChild(shadows);
const state={mode:'day',smooth:true,reduced:false,values:[0,0,0,0,0],target:[0,0,0,0,0]};const settings={day:[0,0,0,0,0],sunset:[.24,0,.12,.55,0],night:[.65,1,.92,.2,1]};function mixColor(a,b,f){const lerp=(x,y)=>Math.round(x+(y-x)*f);return (lerp((a>>16)&255,(b>>16)&255)<<16)|(lerp((a>>8)&255,(b>>8)&255)<<8)|lerp(a&255,b&255);}
function paint(){const [t,lights,star,shadow,nightMix]=state.values;shade.tint=mixColor(0xf8a052,0x172e59,nightMix);shade.alpha=t;glow.alpha=lights;stars.alpha=star;shadows.alpha=shadow;sun.alpha=1-Math.min(1,star*1.05);for(const b of document.querySelectorAll('[data-time]'))b.setAttribute('aria-pressed',String(b.dataset.time===state.mode));}
function report(){document.getElementById('smooth').textContent='Transitions: '+(state.smooth?'ON':'OFF');document.getElementById('reduce').textContent='Reduced motion: '+(state.reduced?'ON':'OFF');status.textContent=state.mode[0].toUpperCase()+state.mode.slice(1)+' selected · '+(state.smooth&&!state.reduced?'gentle transitions':'instant changes')+'.';}
function select(mode){state.mode=mode;state.target=[...settings[mode]];if(!state.smooth||state.reduced)state.values=[...state.target];paint();report();}
document.querySelectorAll('[data-time]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.time)));
document.getElementById('smooth').addEventListener('click',()=>{state.smooth=!state.smooth;if(!state.smooth)state.values=[...state.target];paint();report();});
document.getElementById('reduce').addEventListener('click',()=>{state.reduced=!state.reduced;if(state.reduced)state.values=[...state.target];paint();report();});
document.getElementById('reset').addEventListener('click',()=>{state.smooth=true;state.reduced=false;select('day');});
app.ticker.add(t=>{if(state.smooth&&!state.reduced){const step=Math.min(1,Math.min(t.deltaMS,50)/1000*1.8);for(let i=0;i<5;i++)state.values[i]+=(state.target[i]-state.values[i])*step;paint();}});
function fit(){const w=host.clientWidth,h=host.clientHeight,s=Math.min(w/800,h/600);world.scale.set(s);world.position.set((w-800*s)/2,(h-600*s)/2);}new ResizeObserver(fit).observe(host);fit();select('day');
})().catch(e=>{document.getElementById('status').textContent='Initialization error: '+e.message;});
</script></main></body></html>

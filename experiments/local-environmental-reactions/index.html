<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15212a"><title>Pixie Research — Local Environmental Reactions</title><style>*{box-sizing:border-box}body{margin:0;background:#15212a;color:#f2f5f5;font:16px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:16px}h1{font-size:clamp(1.4rem,4vw,2rem)}a{color:#a4e9df}#stage{width:100%;aspect-ratio:4/3;max-height:480px;border:1px solid #829da3;border-radius:10px;overflow:hidden;background:#668b79;touch-action:none}canvas{display:block;width:100%;height:100%}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button{font:inherit;min-height:44px;padding:10px 13px;border:0;border-radius:9px}#status{line-height:1.5;min-height:3em}</style></head><body><main><p><a href="../../">← All experiments</a></p><h1>Experiment 06: Local Environmental Reactions</h1><p>Touch the grass, pond, or stone marker. Compare responsive and still versions of the same scene.</p><div id="stage" aria-label="Interactive PixiJS landscape with grass, pond, and stone"></div><div class="controls"><button id="reaction">Reactions: ON</button><button id="reduce">Reduced motion: OFF</button><button id="reset">Reset</button></div><p id="status" role="status">Loading PixiJS…</p><script src="https://cdn.jsdelivr.net/npm/pixi.js@8.21.0/dist/pixi.min.js"></script><script>
(async()=>{const host=document.getElementById('stage'),status=document.getElementById('status');if(!window.PIXI){status.textContent='PixiJS failed to load. Internet access is required.';return;}
const app=new PIXI.Application();await app.init({resizeTo:host,background:'#739d8c',antialias:true,resolution:Math.min(devicePixelRatio||1,2)});app.canvas.style.width='100%';app.canvas.style.height='100%';host.appendChild(app.canvas);
const world=new PIXI.Container();app.stage.addChild(world);
world.addChild(new PIXI.Graphics().rect(0,0,800,600).fill(0x89b4a2).ellipse(400,620,650,340).fill(0x6b9873).ellipse(575,350,195,115).fill(0x3b8599).ellipse(560,340,165,85).fill({color:0x89c7c5,alpha:.22}));
const grass=new PIXI.Container();grass.position.set(205,410);world.addChild(grass);const blades=new PIXI.Graphics();for(let i=0;i<11;i++){const x=(i-5)*16;blades.moveTo(x,90).quadraticCurveTo(x-12,15,x+(i%3-1)*24,0).quadraticCurveTo(x+17,35,x+7,90).fill(i%2?0x326d48:0x43865a);}grass.addChild(blades);
const stone=new PIXI.Container();stone.position.set(410,405);world.addChild(stone);const stoneBody=new PIXI.Graphics().roundRect(-62,-60,124,116,20).fill(0x8a9898).roundRect(-47,-44,94,75,12).fill(0xa9b5b1);stone.addChild(stoneBody);const glow=new PIXI.Graphics().circle(0,0,78).stroke({color:0xffe69a,width:8});glow.alpha=0;stone.addChild(glow);
const water=new PIXI.Container();water.position.set(575,350);world.addChild(water);const ripple=new PIXI.Graphics().ellipse(0,0,68,23).stroke({color:0xe7fbf7,width:4});water.addChild(ripple);ripple.alpha=0;
const labels=[['GRASS',205,530],['STONE',410,530],['WATER',620,530]];for(const [t,x,y] of labels){const label=new PIXI.Text({text:t,style:{fontFamily:'Arial, sans-serif',fontSize:22,fontWeight:'bold',fill:0x173f38}});label.anchor.set(.5);label.position.set(x,y);world.addChild(label);}
const state={enabled:true,reduced:false,grass:0,stone:0,water:0},btn=document.getElementById('reaction'),reduce=document.getElementById('reduce');
function paint(){grass.rotation=state.enabled&&!state.reduced?Math.sin(state.grass*10)*.25*Math.min(state.grass,1):0;glow.alpha=state.enabled?(state.reduced?(state.stone>0?.65:0):Math.min(1,state.stone)*.85):0;ripple.alpha=state.enabled?(state.reduced?(state.water>0?.65:0):Math.min(1,state.water)*.8):0;ripple.scale.set(state.enabled&&!state.reduced?1+(1-state.water)*1.3:1);}
function report(msg){btn.textContent='Reactions: '+(state.enabled?'ON':'OFF');reduce.textContent='Reduced motion: '+(state.reduced?'ON':'OFF');status.textContent=msg||('Reactions '+(state.enabled?'enabled':'disabled')+' · '+(state.reduced?'reduced motion':'normal motion')+'.');}
world.eventMode='static';world.hitArea=new PIXI.Rectangle(0,0,800,600);world.on('pointertap',e=>{const p=e.getLocalPosition(world);let target;if(p.x<310&&p.y>315&&p.y<510)target='grass';else if(p.x>=330&&p.x<485&&p.y>310&&p.y<505)target='stone';else if(p.x>=460&&p.x<775&&p.y>225&&p.y<465)target='water';else{report('Touch the grass, stone, or water to test a local reaction.');return;}if(state.enabled){state[target]=1;paint();report(target[0].toUpperCase()+target.slice(1)+' reacted'+(state.reduced?' without movement':'')+'.');}else report('Reactions disabled: '+target+' stays still.');});
btn.addEventListener('click',()=>{state.enabled=!state.enabled;paint();report();});reduce.addEventListener('click',()=>{state.reduced=!state.reduced;paint();report();});document.getElementById('reset').addEventListener('click',()=>{Object.assign(state,{enabled:true,reduced:false,grass:0,stone:0,water:0});paint();report('Reset: touch an object to begin.');});
app.ticker.add(t=>{if(!state.reduced){const dt=Math.min(t.deltaMS,50)/1000;for(const k of ['grass','stone','water'])state[k]=Math.max(0,state[k]-dt*(k==='grass'?1.15:.7));paint();}});
function fit(){const w=host.clientWidth,h=host.clientHeight,s=Math.min(w/800,h/600);world.scale.set(s);world.position.set((w-800*s)/2,(h-600*s)/2);}new ResizeObserver(fit).observe(host);fit();paint();report('Touch grass, stone, or pond.');})().catch(e=>{document.getElementById('status').textContent='Initialization error: '+e.message;});
</script></main></body></html>

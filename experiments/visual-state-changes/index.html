<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15212a"><title>Pixie Research — Visual States</title><style>
*{box-sizing:border-box}body{margin:0;background:#15212a;color:#f3f6f7;font:16px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:16px}h1{font-size:clamp(1.5rem,4vw,2rem)}a{color:#9be6de}#stage{width:100%;aspect-ratio:4/3;max-height:480px;border:1px solid #829da3;border-radius:10px;overflow:hidden;background:#304e55;touch-action:manipulation}canvas{display:block;width:100%;height:100%}button{font:inherit;min-height:44px;padding:11px 16px;border-radius:9px;border:0;margin:8px 8px 0 0}#status{line-height:1.5;min-height:3em}.legend{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.legend span{background:#2c444f;padding:6px 10px;border-radius:20px;font-size:.85rem}</style></head><body><main>
<p><a href="../../">← All experiments</a></p><h1>Experiment 03: Visual State Changes</h1><p>Tap any tile to cycle through four conditions. Watch its color, symbol, and border change without moving or recreating the scene.</p>
<div class="legend"><span>Gray: Available</span><span>Yellow: Selected</span><span>Blue: Active</span><span>Green: Complete</span></div><div id="stage" aria-label="Interactive visual state demonstration"></div><button id="reset">Reset all tiles</button><p id="status" role="status">Loading PixiJS…</p></main>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.21.0/dist/pixi.min.js"></script><script>
(async()=>{
const host=document.getElementById('stage'),status=document.getElementById('status');
if(!window.PIXI){status.textContent='PixiJS failed to load. This test needs an internet connection.';return;}
const app=new PIXI.Application();await app.init({resizeTo:host,background:'#304e55',antialias:true,resolution:Math.min(devicePixelRatio||1,2)});app.canvas.style.width='100%';app.canvas.style.height='100%';host.appendChild(app.canvas);
const world=new PIXI.Container();app.stage.addChild(world);
const states=[
{name:'Available',color:0x9ca6ae,outline:0x465661,symbol:'○'},
{name:'Selected',color:0xffd263,outline:0xffffff,symbol:'◆'},
{name:'Active',color:0x64bce8,outline:0x1c5b8c,symbol:'▶'},
{name:'Complete',color:0x72ce8b,outline:0x276b40,symbol:'✓'}
];
const data=[0,1,2,3,0,1],tiles=[];
function createTile(i){
const c=new PIXI.Container(),body=new PIXI.Graphics(),symbol=new PIXI.Text({text:'',style:{fontFamily:'Arial, sans-serif',fontSize:52,fontWeight:'bold',fill:0x15212a,align:'center'}}),label=new PIXI.Text({text:'Tile '+(i+1),style:{fontFamily:'Arial, sans-serif',fontSize:20,fill:0xffffff}});
c.position.set(155+(i%3)*245,155+Math.floor(i/3)*235);
symbol.anchor.set(.5);symbol.position.set(0,-10);label.anchor.set(.5);label.position.set(0,73);c.addChild(body,symbol,label);c.eventMode='static';c.cursor='pointer';c.hitArea=new PIXI.Rectangle(-85,-80,170,170);c.on('pointertap',()=>{data[i]=(data[i]+1)%states.length;draw(i);report(i);});world.addChild(c);tiles.push({body,symbol});draw(i);
}
function draw(i){const s=states[data[i]],t=tiles[i];t.body.clear().roundRect(-83,-78,166,154,20).fill(s.color).stroke({color:s.outline,width:7});t.symbol.text=s.symbol;}
function report(i){status.textContent='Tile '+(i+1)+': '+states[data[i]].name+'. States are stored separately from the PixiJS graphics.';}
for(let i=0;i<data.length;i++)createTile(i);
document.getElementById('reset').addEventListener('click',()=>{data.fill(0);for(let i=0;i<data.length;i++)draw(i);status.textContent='All six tiles reset to Available.';});
function fit(){const w=host.clientWidth,h=host.clientHeight,s=Math.min(w/800,h/600);world.scale.set(s);world.position.set((w-800*s)/2,(h-600*s)/2);}
new ResizeObserver(fit).observe(host);fit();status.textContent='Tap any tile to change its state. Try different tiles and Reset all tiles.';
})().catch(e=>{document.getElementById('status').textContent='Initialization error: '+e.message;});
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15212a"><title>Pixie Research — Weather and Rain</title><style>*{box-sizing:border-box}body{margin:0;background:#15212a;color:#f2f5f5;font:16px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:16px}h1{font-size:clamp(1.45rem,4vw,2rem)}a{color:#a4e9df}#stage{width:100%;aspect-ratio:4/3;max-height:480px;border:1px solid #829da3;border-radius:10px;overflow:hidden;background:#8ebbc4}canvas{display:block;width:100%;height:100%}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button{font:inherit;min-height:44px;padding:10px 13px;border:0;border-radius:9px}button[aria-pressed=true]{outline:3px solid #a4e9df}#status{line-height:1.5;min-height:3em}</style></head><body><main><p><a href="../../">← All experiments</a></p><h1>Experiment 10: Weather and Rain</h1><p>Compare clear weather, light rain, and heavy rain on the same landscape. Test gradual weather changes and reduced motion.</p><div id="stage" aria-label="Landscape with selectable clear, light rain, and heavy rain weather"></div><div class="controls"><button data-weather="clear">Clear</button><button data-weather="light">Light rain</button><button data-weather="heavy">Heavy rain</button><button id="smooth">Transitions: ON</button><button id="reduce">Reduced motion: OFF</button><button id="pause">Pause</button><button id="reset">Reset</button></div><p id="status" role="status">Loading PixiJS…</p><script src="https://cdn.jsdelivr.net/npm/pixi.js@8.21.0/dist/pixi.min.js"></script><script>
(async()=>{const host=document.getElementById('stage'),status=document.getElementById('status');if(!window.PIXI){status.textContent='PixiJS failed to load. Internet connection required.';return;}
const app=new PIXI.Application();await app.init({resizeTo:host,background:'#a0c7cb',antialias:true,resolution:Math.min(devicePixelRatio||1,2)});app.canvas.style.width='100%';app.canvas.style.height='100%';host.appendChild(app.canvas);
const world=new PIXI.Container();app.stage.addChild(world);
world.addChild(new PIXI.Graphics().rect(0,0,800,600).fill(0xa2cbd1).ellipse(140,340,370,150).fill(0x82ae9c).ellipse(640,340,410,155).fill(0x709b8d).rect(0,350,800,250).fill(0x82ad78).ellipse(440,565,600,140).fill(0x67966b));
const pond=new PIXI.Graphics().ellipse(220,495,165,61).fill(0x4f8999).ellipse(212,478,120,28).fill({color:0xb4dedb,alpha:.25});world.addChild(pond);
const cabin=new PIXI.Graphics().roundRect(435,300,210,168,10).fill(0xd6b98c).moveTo(412,313).lineTo(540,224).lineTo(668,313).closePath().fill(0x855d4f).roundRect(521,374,52,94,5).fill(0x7b5a48).rect(463,350,41,43).fill(0x79a8b3).rect(593,350,37,43).fill(0x79a8b3);world.addChild(cabin);
const tree=new PIXI.Graphics().rect(92,295,22,162).fill(0x765846).circle(103,285,76).fill(0x46795d).circle(66,310,47).fill(0x4d8766);world.addChild(tree);
const tint=new PIXI.Graphics().rect(0,0,800,600).fill(0x263c61);tint.alpha=0;world.addChild(tint);
const rain=new PIXI.Graphics();world.addChild(rain);const ripples=new PIXI.Graphics();world.addChild(ripples);
const drops=[];for(let i=0;i<95;i++)drops.push({x:(i*179+23)%820,y:(i*97+19)%640,offset:i*1.73,length:11+(i%4)*4});
const state={weather:'clear',intensity:0,target:0,smooth:true,reduced:false,paused:false,time:0};const levels={clear:0,light:.38,heavy:1};
function paint(){tint.alpha=state.intensity*.37;rain.clear();ripples.clear();if(state.intensity<.015)return;const count=Math.round(95*state.intensity);for(let i=0;i<count;i++){const d=drops[i],speed=state.reduced?0:state.time*(state.weather==='heavy'?275:220),y=(d.y+speed+d.offset*10)%660-30,x=d.x+(state.reduced?0:state.time*12)%55;rain.moveTo(x,y).lineTo(x-5*state.intensity,y+d.length).stroke({color:0xd9edf1,width:state.intensity>.6?2.1:1.5,alpha:.28+.38*state.intensity});}
for(let i=0;i<7;i++){const p=(state.reduced?i/7:(state.time*.75+i/7)%1),x=145+(i*47)%150,y=467+(i*17)%45;ripples.ellipse(x,y,4+p*22,2+p*8).stroke({color:0xe0f5f1,width:1.8,alpha:state.intensity*.65*(1-p)});}}
function report(){for(const b of document.querySelectorAll('[data-weather]'))b.setAttribute('aria-pressed',String(b.dataset.weather===state.weather));document.getElementById('smooth').textContent='Transitions: '+(state.smooth?'ON':'OFF');document.getElementById('reduce').textContent='Reduced motion: '+(state.reduced?'ON':'OFF');document.getElementById('pause').textContent=state.paused?'Resume':'Pause';status.textContent=({clear:'Clear',light:'Light rain',heavy:'Heavy rain'})[state.weather]+' · '+(state.smooth&&!state.reduced?'gradual weather changes':'instant weather changes')+(state.paused?' · paused':'')+'.';}
function select(w){state.weather=w;state.target=levels[w];if(!state.smooth||state.reduced)state.intensity=state.target;paint();report();}
document.querySelectorAll('[data-weather]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.weather)));
document.getElementById('smooth').addEventListener('click',()=>{state.smooth=!state.smooth;if(!state.smooth)state.intensity=state.target;paint();report();});
document.getElementById('reduce').addEventListener('click',()=>{state.reduced=!state.reduced;if(state.reduced)state.intensity=state.target;paint();report();});
document.getElementById('pause').addEventListener('click',()=>{state.paused=!state.paused;report();});
document.getElementById('reset').addEventListener('click',()=>{Object.assign(state,{weather:'clear',intensity:0,target:0,smooth:true,reduced:false,paused:false,time:0});paint();report();});
app.ticker.add(t=>{if(!state.paused){const dt=Math.min(t.deltaMS,50)/1000;if(!state.reduced)state.time+=dt;if(state.smooth&&!state.reduced)state.intensity+=(state.target-state.intensity)*Math.min(1,dt*1.4);paint();}});
function fit(){const w=host.clientWidth,h=host.clientHeight,s=Math.min(w/800,h/600);world.scale.set(s);world.position.set((w-800*s)/2,(h-600*s)/2);}new ResizeObserver(fit).observe(host);fit();paint();report();
})().catch(e=>{document.getElementById('status').textContent='Initialization error: '+e.message;});
</script></main></body></html>

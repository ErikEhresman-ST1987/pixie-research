<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17262b"><title>Pixie Research — Living Landscape</title><style>*{box-sizing:border-box}body{margin:0;background:#14252b;color:#f0f6f5;font:16px system-ui,-apple-system,sans-serif}main{max-width:850px;margin:auto;padding:16px}h1{font-size:clamp(1.5rem,4vw,2rem)}a{color:#a7e5da}#stage{width:100%;aspect-ratio:4/3;max-height:480px;border-radius:12px;overflow:hidden;border:1px solid #72928e;background:#a2c7c4}canvas{display:block;width:100%;height:100%}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{font:inherit;min-height:44px;border:0;border-radius:9px;padding:10px 13px;background:#e6eeee;color:#17262b}button[aria-pressed=true]{outline:3px solid #a6e8d7;outline-offset:2px}#status{line-height:1.5;min-height:2em}</style></head><body><main><p><a href="../../">← All experiments</a></p><h1>Experiment 11: The Living Landscape</h1><p>Combine proven techniques. Compare quiet and living scenes, then isolate individual effects. Can everything coexist without becoming distracting?</p><div id="stage" aria-label="Interactive meadow with pond, cottage, ambient creatures, rain, and sunset"></div><div class="controls"><button id="quiet">Quiet scene</button><button id="living">Living scene</button><button id="life">Ambient life: ON</button><button id="rain">Rain: OFF</button><button id="sunset">Sunset: OFF</button><button id="motion">Reduced motion: OFF</button><button id="pause">Pause</button><button id="reset">Reset</button></div><p id="status" role="status">Loading…</p><script src="https://cdn.jsdelivr.net/npm/pixi.js@8.21.0/dist/pixi.min.js"></script><script>
(async()=>{const host=document.getElementById('stage'),status=document.getElementById('status');if(!window.PIXI){status.textContent='PixiJS failed to load. Internet required.';return;}const app=new PIXI.Application();await app.init({resizeTo:host,background:'#a4c9c6',antialias:true,resolution:Math.min(devicePixelRatio||1,2)});host.appendChild(app.canvas);app.canvas.style.width='100%';app.canvas.style.height='100%';const world=new PIXI.Container();app.stage.addChild(world);
const land=new PIXI.Graphics().rect(0,0,800,600).fill(0xa4c9c6).ellipse(160,340,420,150).fill(0x82ab95).ellipse(640,365,390,165).fill(0x79a08e).rect(0,366,800,234).fill(0x84ac75).ellipse(460,590,550,150).fill(0x739e6e);world.addChild(land);
world.addChild(new PIXI.Graphics().ellipse(220,492,165,61).fill(0x538c9a).ellipse(212,478,118,25).fill({color:0xd6f2e9,alpha:.22}));
world.addChild(new PIXI.Graphics().roundRect(444,315,205,153,9).fill(0xd7bd93).moveTo(420,325).lineTo(546,238).lineTo(673,325).closePath().fill(0x865f4e).roundRect(523,380,49,88,4).fill(0x7b5948).rect(470,353,40,44).fill(0x83b2bd).rect(593,353,36,44).fill(0x83b2bd));
world.addChild(new PIXI.Graphics().rect(100,309,21,150).fill(0x735848).circle(110,298,70).fill(0x4e8163).circle(74,316,46).fill(0x548b6a));
const grass=new PIXI.Graphics();world.addChild(grass);const life=new PIXI.Graphics();world.addChild(life);const ripples=new PIXI.Graphics();world.addChild(ripples);const rain=new PIXI.Graphics();world.addChild(rain);const light=new PIXI.Graphics().rect(0,0,800,600).fill(0xf5a061);light.alpha=0;world.addChild(light);const nightTint=new PIXI.Graphics().rect(0,0,800,600).fill(0x263c61);nightTint.alpha=0;world.addChild(nightTint);
const state={life:true,rain:false,sunset:false,reduced:false,paused:false,time:0,lightAmount:0,rainAmount:0};const drops=Array.from({length:75},(_,i)=>({x:(i*173+27)%830,y:(i*113+43)%630,len:12+i%4*3}));const bugs=Array.from({length:9},(_,i)=>({x:250+(i*67)%440,y:220+(i*73)%260,phase:i*1.9}));
function draw(){const t=state.time;grass.clear();for(let k=0;k<13;k++){const x=320+k*27,y=470+(k%3)*8,sw=state.reduced?0:Math.sin(t*1.7+k*.6)*6;grass.moveTo(x,y).quadraticCurveTo(x-7+sw*.6,y-18,x+sw,y-34-(k%3)*6).stroke({color:k%2?0x3d7653:0x56865a,width:3.2});}
life.clear();if(state.life){for(let i=0;i<3;i++){const p=bugs[i],x=p.x+(state.reduced?0:Math.sin(t*.6+p.phase)*25),y=p.y+(state.reduced?0:Math.sin(t*.9+p.phase)*13),w=state.reduced?6:4+Math.abs(Math.sin(t*9+p.phase))*6;life.ellipse(x-w*.5,y,w,5).fill({color:0xf4d9a0,alpha:.88}).ellipse(x+w*.5,y,w,5).fill({color:0xf7e3a8,alpha:.88}).circle(x,y,2.2).fill(0x514d42);}for(let i=3;i<9;i++){const p=bugs[i],x=p.x+(state.reduced?0:Math.sin(t*.35+p.phase)*17),y=p.y+(state.reduced?0:Math.cos(t*.5+p.phase)*12),a=state.reduced?.45:.25+.55*(.5+.5*Math.sin(t*2.6+p.phase));life.circle(x,y,3).fill({color:0xf9e7a3,alpha:a});}}
ripples.clear();if(state.rainAmount>.02){for(let i=0;i<6;i++){const p=state.reduced?i/6:(t*.65+i/6)%1;ripples.ellipse(135+i*35,475+(i%3)*16,4+p*20,2+p*7).stroke({color:0xe4f3f2,width:1.5,alpha:state.rainAmount*(1-p)*.65});}}
rain.clear();if(state.rainAmount>.02){const count=Math.round(75*state.rainAmount);for(let i=0;i<count;i++){const d=drops[i],y=(d.y+(state.reduced?0:t*230+i*5))%650-20;rain.moveTo(d.x,y).lineTo(d.x-4,y+d.len).stroke({color:0xe1f0f1,width:1.5,alpha:.48});}}
light.alpha=state.lightAmount*.28;nightTint.alpha=state.rainAmount*.22;}
function sync(){for(const k of ['life','rain','sunset','motion','pause']){const b=document.getElementById(k);b.setAttribute('aria-pressed',String(k==='motion'?state.reduced:k==='pause'?state.paused:state[k]));}document.getElementById('life').textContent='Ambient life: '+(state.life?'ON':'OFF');document.getElementById('rain').textContent='Rain: '+(state.rain?'ON':'OFF');document.getElementById('sunset').textContent='Sunset: '+(state.sunset?'ON':'OFF');document.getElementById('motion').textContent='Reduced motion: '+(state.reduced?'ON':'OFF');document.getElementById('pause').textContent=state.paused?'Resume':'Pause';status.textContent=[state.life?'ambient life':'no creatures',state.rain?'rain':'dry weather',state.sunset?'sunset':'daylight',state.paused?'paused':'running'].join(' · ');}
function setPreset(living){state.life=living;state.rain=living;state.sunset=living;sync();}
document.getElementById('quiet').onclick=()=>setPreset(false);document.getElementById('living').onclick=()=>setPreset(true);for(const k of ['life','rain','sunset'])document.getElementById(k).onclick=()=>{state[k]=!state[k];sync();};document.getElementById('motion').onclick=()=>{state.reduced=!state.reduced;sync();draw();};document.getElementById('pause').onclick=()=>{state.paused=!state.paused;sync();};document.getElementById('reset').onclick=()=>{Object.assign(state,{life:true,rain:false,sunset:false,reduced:false,paused:false,time:0,lightAmount:0,rainAmount:0});sync();draw();};
app.ticker.add(t=>{if(state.paused)return;const dt=Math.min(t.deltaMS,50)/1000;if(!state.reduced)state.time+=dt;const blend=Math.min(1,dt*1.6);state.lightAmount+=(Number(state.sunset)-state.lightAmount)*blend;state.rainAmount+=(Number(state.rain)-state.rainAmount)*blend;draw();});
function fit(){const w=host.clientWidth,h=host.clientHeight,s=Math.min(w/800,h/600);world.scale.set(s);world.position.set((w-800*s)/2,(h-600*s)/2);}new ResizeObserver(fit).observe(host);fit();sync();draw();
})().catch(e=>{document.getElementById('status').textContent='Initialization error: '+e.message;});
</script></main></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15212a"><title>Pixie Research — Production Activity</title><style>*{box-sizing:border-box}body{margin:0;background:#15212a;color:#f3f6f5;font:16px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:16px}h1{font-size:clamp(1.45rem,4vw,2rem)}a{color:#a5e9df}#stage{width:100%;aspect-ratio:4/3;max-height:480px;overflow:hidden;border:1px solid #829da3;border-radius:10px;background:#8eb5b6}canvas{display:block;width:100%;height:100%}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button{font:inherit;min-height:44px;padding:10px 13px;border:0;border-radius:9px}#status{line-height:1.5;min-height:3em}</style></head><body><main><p><a href="../../">← All experiments</a></p><h1>Experiment 08: Production Activity</h1><p>A tiny workshop with a turning wheel, chimney smoke, and a work-progress display. Start a job, pause it, and compare animated versus static presentation.</p><div id="stage" aria-label="PixiJS workshop with wheel, smoke, and production status"></div><div class="controls"><button id="job">Start job</button><button id="pause">Pause job</button><button id="effects">Effects: ON</button><button id="reduce">Reduced motion: OFF</button><button id="reset">Reset</button></div><p id="status" role="status">Ready. Start a job to see production activity.</p><script src="https://cdn.jsdelivr.net/npm/pixi.js@8.21.0/dist/pixi.min.js"></script><script>
(async()=>{const host=document.getElementById('stage'),status=document.getElementById('status');if(!window.PIXI){status.textContent='PixiJS failed to load. Internet access is required.';return;}
const app=new PIXI.Application();await app.init({resizeTo:host,background:'#95bec0',antialias:true,resolution:Math.min(devicePixelRatio||1,2)});app.canvas.style.width='100%';app.canvas.style.height='100%';host.appendChild(app.canvas);
const world=new PIXI.Container();app.stage.addChild(world);
const scene=new PIXI.Graphics().rect(0,0,800,600).fill(0x9bc4c4).ellipse(400,550,580,180).fill(0x7aab7d).rect(0,475,800,125).fill(0x6f9d70);world.addChild(scene);
const building=new PIXI.Graphics().roundRect(200,215,400,290,18).fill(0xe4c89d).roundRect(215,235,370,250,12).fill(0xf0dcb6).moveTo(175,235).lineTo(400,100).lineTo(625,235).closePath().fill(0x955d4e).roundRect(505,132,58,120,7).fill(0x8d6258).roundRect(333,333,134,170,12).fill(0x835d49).roundRect(345,344,110,150,8).fill(0xa67a5a);world.addChild(building);
const chimneyTop=new PIXI.Graphics().roundRect(499,128,70,20,5).fill(0x6e4b43);world.addChild(chimneyTop);
const wheel=new PIXI.Container();wheel.position.set(310,372);const wheelArt=new PIXI.Graphics().circle(0,0,58).fill(0x7e5d42).circle(0,0,45).fill(0xb48758).circle(0,0,35).fill(0xead0a0);for(let i=0;i<8;i++){const a=i*Math.PI/4;wheelArt.moveTo(Math.cos(a)*8,Math.sin(a)*8).lineTo(Math.cos(a)*53,Math.sin(a)*53).stroke({color:0x73513a,width:8});}wheelArt.circle(0,0,12).fill(0x5e4638);wheel.addChild(wheelArt);world.addChild(wheel);
const smoke=new PIXI.Container();world.addChild(smoke);const puffs=[];for(let i=0;i<6;i++){const p=new PIXI.Graphics().circle(0,0,18+i%3*5).fill(0xf4f6f1);smoke.addChild(p);puffs.push(p);}
const progressBack=new PIXI.Graphics().roundRect(242,535,316,24,10).fill(0x42675e);world.addChild(progressBack);const progressFill=new PIXI.Graphics();world.addChild(progressFill);
const textStyle={fontFamily:'Arial, sans-serif',fontSize:23,fontWeight:'bold',fill:0x23473c};const label=new PIXI.Text({text:'READY',style:textStyle});label.anchor.set(.5);label.position.set(400,575);world.addChild(label);
const state={phase:'ready',progress:0,paused:false,effects:true,reduced:false,clock:0};const duration=12;const jobBtn=document.getElementById('job'),pauseBtn=document.getElementById('pause'),effectsBtn=document.getElementById('effects'),reduceBtn=document.getElementById('reduce');
function paint(){const running=state.phase==='working'&&!state.paused,animate=running&&state.effects&&!state.reduced;
wheel.rotation=state.effects&&!state.reduced?state.clock*2.3:0;
puffs.forEach((p,i)=>{const u=((state.clock*.18+i/6)%1);p.visible=state.phase==='working'&&state.effects;p.x=534+Math.sin(u*5+i)*18;p.y=129-u*125;p.alpha=state.reduced?.38:Math.max(.05,.68*(1-u));p.scale.set(state.reduced?.75:.65+u*.65);});
progressFill.clear().roundRect(246,539,Math.max(0,308*state.progress),16,6).fill(state.phase==='complete'?0x74d4a2:0xffd477);
label.text=state.phase==='ready'?'READY':state.phase==='complete'?'COMPLETE':state.paused?'PAUSED':state.reduced?'WORKING · STILL':'WORKING';
}
function report(){jobBtn.textContent=state.phase==='working'?'Job running':state.phase==='complete'?'Start new job':'Start job';jobBtn.disabled=state.phase==='working';pauseBtn.textContent=state.paused?'Resume job':'Pause job';pauseBtn.disabled=state.phase!=='working';effectsBtn.textContent='Effects: '+(state.effects?'ON':'OFF');reduceBtn.textContent='Reduced motion: '+(state.reduced?'ON':'OFF');status.textContent=(state.phase==='ready'?'Ready to start':state.phase==='complete'?'Job complete':state.paused?'Job paused':'Job running')+' · '+Math.round(state.progress*100)+'% · '+(state.effects?'effects visible':'effects hidden')+'.';}
jobBtn.addEventListener('click',()=>{if(state.phase==='working')return;Object.assign(state,{phase:'working',progress:0,paused:false,clock:0});paint();report();});
pauseBtn.addEventListener('click',()=>{if(state.phase!=='working')return;state.paused=!state.paused;paint();report();});
effectsBtn.addEventListener('click',()=>{state.effects=!state.effects;paint();report();});
reduceBtn.addEventListener('click',()=>{state.reduced=!state.reduced;paint();report();});
document.getElementById('reset').addEventListener('click',()=>{Object.assign(state,{phase:'ready',progress:0,paused:false,effects:true,reduced:false,clock:0});paint();report();});
app.ticker.add(t=>{if(state.phase==='working'&&!state.paused){const dt=Math.min(t.deltaMS,50)/1000;state.progress=Math.min(1,state.progress+dt/duration);if(state.effects&&!state.reduced)state.clock+=dt;if(state.progress>=1){state.phase='complete';}paint();report();}});
function fit(){const w=host.clientWidth,h=host.clientHeight,s=Math.min(w/800,h/600);world.scale.set(s);world.position.set((w-800*s)/2,(h-600*s)/2);}new ResizeObserver(fit).observe(host);fit();paint();report();
})().catch(e=>{document.getElementById('status').textContent='Initialization error: '+e.message;});
</script></main></body></html>

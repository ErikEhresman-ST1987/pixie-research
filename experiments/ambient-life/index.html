<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15212a"><title>Pixie Research — Ambient Life</title><style>*{box-sizing:border-box}body{margin:0;background:#15212a;color:#f2f6f4;font:16px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:16px}h1{font-size:clamp(1.5rem,4vw,2rem)}a{color:#a4e9df}#stage{width:100%;aspect-ratio:4/3;max-height:480px;border:1px solid #829da3;border-radius:10px;overflow:hidden;background:#83adba;touch-action:manipulation}canvas{display:block;width:100%;height:100%}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button{font:inherit;min-height:44px;padding:10px 13px;border:0;border-radius:9px}#status{line-height:1.5;min-height:3em}</style></head><body><main><p><a href="../../">← All experiments</a></p><h1>Experiment 07: Ambient Life</h1><p>A peaceful meadow with butterflies, fireflies, and distant birds. Try switching ambient life off, reducing the number of creatures, or freezing motion.</p><div id="stage" aria-label="Animated meadow with small ambient creatures"></div><div class="controls"><button id="life">Ambient life: ON</button><button id="density">Activity: Gentle</button><button id="motion">Reduced motion: OFF</button><button id="pause">Pause</button><button id="reset">Reset</button></div><p id="status" role="status">Loading PixiJS…</p><script src="https://cdn.jsdelivr.net/npm/pixi.js@8.21.0/dist/pixi.min.js"></script><script>
(async()=>{const host=document.getElementById('stage'),status=document.getElementById('status');if(!window.PIXI){status.textContent='PixiJS failed to load. This demo requires internet access.';return;}
const app=new PIXI.Application();await app.init({resizeTo:host,background:'#8bb9c3',antialias:true,resolution:Math.min(devicePixelRatio||1,2)});app.canvas.style.width='100%';app.canvas.style.height='100%';host.appendChild(app.canvas);
const world=new PIXI.Container();app.stage.addChild(world);
world.addChild(new PIXI.Graphics().rect(0,0,800,600).fill(0x9fc6c7).ellipse(120,320,340,145).fill(0x6f9c89).ellipse(650,335,420,160).fill(0x699681).rect(0,340,800,260).fill(0x7dab78).ellipse(400,570,580,155).fill(0x6d9b69));
const flowers=new PIXI.Graphics();for(let i=0;i<35;i++){const x=45+(i*113)%710,y=415+(i*71)%145;flowers.moveTo(x,y+14).lineTo(x,y-4).stroke({color:0x3f7950,width:2});flowers.circle(x,y-6,5).fill(i%3===0?0xf9d68e:i%3===1?0xf4b5b8:0xe8d8ff).circle(x,y-6,2).fill(0xf7f1ca);}world.addChild(flowers);
const butterflies=[];for(let i=0;i<5;i++){const c=new PIXI.Container(),wings=new PIXI.Graphics().ellipse(-10,0,12,17).fill(i%2?0xf8c8aa:0xffdf8c).ellipse(10,0,12,17).fill(i%2?0xf8c8aa:0xffdf8c).ellipse(0,1,3,16).fill(0x4d5644);c.addChild(wings);world.addChild(c);butterflies.push({c,wings,x:125+i*133,y:350+(i%3)*50,phase:i*1.9});}
const fireflies=[];for(let i=0;i<12;i++){const c=new PIXI.Container(),halo=new PIXI.Graphics().circle(0,0,11).fill({color:0xfff1a2,alpha:.18}),dot=new PIXI.Graphics().circle(0,0,3.5).fill(0xffed8c);c.addChild(halo,dot);world.addChild(c);fireflies.push({c,x:80+(i*157)%655,y:390+(i*43)%165,phase:i*1.47});}
const birds=[];for(let i=0;i<3;i++){const c=new PIXI.Container(),g=new PIXI.Graphics().moveTo(-18,0).quadraticCurveTo(-9,-12,0,0).quadraticCurveTo(9,-12,18,0).stroke({color:0x435e63,width:3});c.addChild(g);world.addChild(c);birds.push({c,g,phase:i*2.3});}
const state={life:true,activity:0,reduced:false,paused:false,t:0},lifeBtn=document.getElementById('life'),densityBtn=document.getElementById('density'),motionBtn=document.getElementById('motion'),pauseBtn=document.getElementById('pause');
function paint(){const moving=state.life&&!state.reduced,more=state.activity===1;
butterflies.forEach((b,i)=>{b.c.visible=state.life&&(more||i<3);b.c.position.set(b.x+(moving?Math.sin(state.t*.65+b.phase)*37:0),b.y+(moving?Math.sin(state.t*1.4+b.phase)*19:0));b.wings.scale.x=moving?.78+Math.abs(Math.sin(state.t*8+b.phase))*.45:1;});
fireflies.forEach((f,i)=>{f.c.visible=state.life&&(more||i<6);f.c.position.set(f.x+(moving?Math.sin(state.t*.45+f.phase)*18:0),f.y+(moving?Math.cos(state.t*.65+f.phase)*14:0));f.c.alpha=moving?.22+(Math.sin(state.t*2.2+f.phase)+1)*.39:.75;});
birds.forEach((b,i)=>{b.c.visible=state.life&&(more||i===0);b.c.position.set(90+i*145+(moving?(state.t*16+i*80)%700:0),130+i*33+(moving?Math.sin(state.t*.7+b.phase)*9:0));b.g.scale.y=moving?.75+Math.sin(state.t*3+b.phase)*.22:1;});
}
function report(){lifeBtn.textContent='Ambient life: '+(state.life?'ON':'OFF');densityBtn.textContent='Activity: '+(state.activity?'Busy':'Gentle');motionBtn.textContent='Reduced motion: '+(state.reduced?'ON':'OFF');pauseBtn.textContent=state.paused?'Resume':'Pause';status.textContent=(state.life?'Ambient life visible':'Landscape only')+' · '+(state.activity?'More creatures':'Fewer creatures')+' · '+(state.reduced?'Static poses':state.paused?'Paused':'Animated')+'.';}
lifeBtn.addEventListener('click',()=>{state.life=!state.life;paint();report();});densityBtn.addEventListener('click',()=>{state.activity=1-state.activity;paint();report();});motionBtn.addEventListener('click',()=>{state.reduced=!state.reduced;paint();report();});pauseBtn.addEventListener('click',()=>{state.paused=!state.paused;report();});document.getElementById('reset').addEventListener('click',()=>{Object.assign(state,{life:true,activity:0,reduced:false,paused:false,t:0});paint();report();});
app.ticker.add(t=>{if(!state.paused){state.t+=Math.min(t.deltaMS,50)/1000;paint();}});
function fit(){const w=host.clientWidth,h=host.clientHeight,s=Math.min(w/800,h/600);world.scale.set(s);world.position.set((w-800*s)/2,(h-600*s)/2);}new ResizeObserver(fit).observe(host);fit();paint();report();
})().catch(e=>{document.getElementById('status').textContent='Initialization error: '+e.message;});
</script></main></body></html>
